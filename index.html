<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>正面振動ナビ 試作品</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    .box {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin: 15px auto;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin: 10px;
    }

    #direction {
      font-size: 40px;
      font-weight: bold;
      margin: 20px;
    }

    button {
      font-size: 18px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      margin: 10px;
      cursor: pointer;
    }

    #startButton {
      background: #333;
      color: white;
    }

    #status {
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>正面振動ナビ</h1>

  <div class="box">

    <p>現在の向き</p>
    <div class="value">
      <span id="heading">---</span>°
    </div>

    <p>目的地方向</p>
    <div class="value">
      <span id="bearing">---</span>°
    </div>

    <p>角度の差</p>
    <div class="value">
      <span id="difference">---</span>°
    </div>

    <div id="direction">
      ---
    </div>

    <p id="status">
      「ナビを開始」を押してください
    </p>

  </div>

  <button id="startButton">
    ナビを開始
  </button>


<script>

  // ==========================================
  // 目的地
  // ==========================================

  // 現在は函館駅付近を目的地にしています
  const destinationLat = 41.7737;
  const destinationLon = 140.7266;


  // ==========================================
  // 設定
  // ==========================================

  // 正面と判定する角度
  const FORWARD_ANGLE = 20;

  // 振動間隔
  const VIBRATION_INTERVAL = 5000;

  // 振動時間
  const VIBRATION_TIME = 300;


  // ==========================================
  // 変数
  // ==========================================

  let currentHeading = null;
  let destinationBearing = null;

  let navigationStarted = false;

  let vibrationTimer = null;

  let isForward = false;


  // ==========================================
  // ボタン
  // ==========================================

  document.getElementById("startButton").addEventListener("click", async function() {

    navigationStarted = true;

    document.getElementById("status").textContent =
      "位置情報と方角を取得しています…";

    // Android / Chromeでセンサー許可が必要な場合
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

      try {

        const permission =
          await DeviceOrientationEvent.requestPermission();

        if (permission !== "granted") {

          document.getElementById("status").textContent =
            "方角センサーの許可が必要です。";

          return;
        }

      } catch (error) {

        console.log(error);

      }
    }


    // 方角取得
    window.addEventListener(
      "deviceorientationabsolute",
      handleOrientation,
      true
    );


    // GPS取得
    navigator.geolocation.watchPosition(
      handlePosition,
      handlePositionError,
      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }
    );

  });


  // ==========================================
  // 方角取得
  // ==========================================

  function handleOrientation(event) {

    let heading = null;


    // Android Chrome
    if (event.absolute && event.alpha !== null) {

      heading = 360 - event.alpha;

    }

    // 念のため通常のdeviceorientationも確認
    if (heading === null && event.alpha !== null) {

      heading = 360 - event.alpha;

    }


    if (heading !== null) {

      heading = (heading + 360) % 360;

      currentHeading = heading;

      document.getElementById("heading").textContent =
        Math.round(currentHeading);

      updateDirection();

    }

  }


  // ==========================================
  // GPS
  // ==========================================

  function handlePosition(position) {

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;


    destinationBearing =
      calculateBearing(
        latitude,
        longitude,
        destinationLat,
        destinationLon
      );


    document.getElementById("bearing").textContent =
      Math.round(destinationBearing);


    updateDirection();

  }


  // ==========================================
  // GPSエラー
  // ==========================================

  function handlePositionError(error) {

    console.log(error);

    document.getElementById("status").textContent =
      "位置情報を取得できません。GPSを確認してください。";

  }


  // ==========================================
  // 目的地までの方角を計算
  // ==========================================

  function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;

    const Δλ =
      (lon2 - lon1) * Math.PI / 180;


    const y =
      Math.sin(Δλ) * Math.cos(φ2);

    const x =
      Math.cos(φ1) * Math.sin(φ2)
      -
      Math.sin(φ1) *
      Math.cos(φ2) *
      Math.cos(Δλ);


    let bearing =
      Math.atan2(y, x) * 180 / Math.PI;


    bearing =
      (bearing + 360) % 360;


    return bearing;

  }


  // ==========================================
  // 方向判定
  // ==========================================

  function updateDirection() {

    if (
      currentHeading === null ||
      destinationBearing === null
    ) {

      return;

    }


    // 角度の差を -180 ～ +180 にする

    let difference =
      destinationBearing - currentHeading;

    difference =
      ((difference + 540) % 360) - 180;


    document.getElementById("difference").textContent =
      Math.round(difference);


    // ========================================
    // 正面
    // ========================================

    const nowForward =
      Math.abs(difference) <= FORWARD_ANGLE;


    if (nowForward) {

      document.getElementById("direction").textContent =
        "↑ 正面";

      document.getElementById("status").textContent =
        "この方向に進んでください";


      // 正面に入った瞬間
      if (!isForward) {

        startVibration();

      }

    }

    else {

      document.getElementById("direction").textContent =
        "○ 正面ではありません";

      document.getElementById("status").textContent =
        "目的地の方向を探してください";


      // 正面から外れたら振動停止
      stopVibration();

    }


    isForward = nowForward;

  }


  // ==========================================
  // 振動開始
  // ==========================================

  function startVibration() {

    // まず一回振動

    if (navigator.vibrate) {

      navigator.vibrate(VIBRATION_TIME);

    }


    // 5秒ごとに振動

    vibrationTimer =
      setInterval(function() {

        // 正面にいる場合だけ振動

        if (isForward && navigator.vibrate) {

          navigator.vibrate(VIBRATION_TIME);

        }

      }, VIBRATION_INTERVAL);

  }


  // ==========================================
  // 振動停止
  // ==========================================

  function stopVibration() {

    if (vibrationTimer !== null) {

      clearInterval(vibrationTimer);

      vibrationTimer = null;

    }


    if (navigator.vibrate) {

      navigator.vibrate(0);

    }

  }

</script>

</body>
</html>
