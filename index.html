<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>あのこのて ナビシステム 試作品</title>
  <link rel="stylesheet" href="destination-search.css">
  <script src="destination-search.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #12151A;
      --panel: #191D24;
      --panel-line: #262B33;
      --ink: #E9EAE6;
      --muted: #7C8794;
      --lock: #FFB020;
      --self: #4FD1FF;
      --danger: #FF5C5C;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 30px 15px 40px;
      background: var(--bg);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
    }

    h1 {
      margin: 0 0 20px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px;
    }

    .box {
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 10px;
      padding: 20px;
      margin: 15px auto;
      text-align: left;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    }

    .box h2,
    .connection-options h2 {
      margin: 0 0 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
    }

    .connection-options {
      max-width: 520px;
      margin: 24px auto 0;
    }

    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid var(--panel-line);
      border-radius: 7px;
      background: #0F1216;
      color: var(--ink);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--self);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .connection-options > div {
      display: flex;
      gap: 10px;
    }

    #wifiButton,
    #bluetoothButton {
      flex: 1;
      color: #12151A;
    }

    #wifiButton {
      border-color: var(--lock);
      background: var(--lock);
    }

    #bluetoothButton {
      border-color: var(--self);
      background: var(--self);
    }

    #status {
      font-size: 16px;
      margin-top: 15px;
      color: var(--danger);
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--panel-line);
      border-radius: 7px;
      background: #0F1216;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }

    input::placeholder {
      color: var(--muted);
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .coordinates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 420px) {
      .coordinates {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .connection-options > div {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <h1>あのこのて ナビシステム</h1>
  <div class="box">
    <h2>目的地を設定</h2>
    <div class="destination-search">
      <label for="destinationQuery">住所・施設名</label>
      <div class="destination-search__row">
        <input id="destinationQuery" type="search" placeholder="例: 東京駅、新宿区西新宿2-8-1">
        <button id="destinationSearchButton" type="button">検索</button>
      </div>
      <p id="destinationSearchStatus" class="destination-search__status" role="status" aria-live="polite"></p>
      <div id="destinationResults" class="destination-search__results" aria-label="検索候補"></div>
      <p class="destination-search__credit">
        住所はOpenStreetMapの検索サービスへ送信されます。非公開情報は入力しないでください。<br>
        地図データ: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap contributors</a>
      </p>
    </div>
    <p id="status" role="status" aria-live="polite"></p>

    <div class="coordinates">
      <div>
        <label for="targetLat">緯度 (直接入力)</label>
        <input id="targetLat" type="number" step="any" placeholder="例: 35.6895" required>
      </div>
      <div>
        <label for="targetLng">経度 (直接入力)</label>
        <input id="targetLng" type="number" step="any" placeholder="例: 139.6917" required>
      </div>
    </div>
  </div>
  <div class="connection-options">
    <h2>接続方法を選択</h2>
    <div>
      <button id="wifiButton" type="button">WiFi接続でナビ開始</button>
      <button id="bluetoothButton" type="button">Bluetooth接続でナビ開始</button>
    </div>
  </div>

  <script>
    function openNavigation(page) {
      const latitudeValue = document.getElementById("targetLat").value.trim();
      const longitudeValue = document.getElementById("targetLng").value.trim();
      const latitude = Number(latitudeValue);
      const longitude = Number(longitudeValue);
      const status = document.getElementById("status");

      if (latitudeValue === "" || longitudeValue === "" ||
          !Number.isFinite(latitude) || latitude < -90 || latitude > 90 ||
          !Number.isFinite(longitude) || longitude < -180 || longitude > 180) {
        status.textContent = "緯度は-90〜90、経度は-180〜180の範囲で入力してください。";
        return;
      }

      const params = new URLSearchParams({
        targetLat: String(latitude),
        targetLng: String(longitude)
      });
      window.location.href = `${page}?${params.toString()}`;
    }

    document.getElementById("wifiButton").addEventListener("click", () => {
      openNavigation("WiFinavi.html");
    });
    document.getElementById("bluetoothButton").addEventListener("click", () => {
      openNavigation("BLEnavi.html");
    });
  </script>
</body>
</html>
