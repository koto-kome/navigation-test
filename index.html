<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>方向ナビゲーション試作</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
    }

    .value {
      font-size: 24px;
      margin: 15px;
    }

    #direction {
      font-size: 60px;
      font-weight: bold;
      margin: 30px 0;
    }

    #message {
      font-size: 20px;
    }

    button {
      font-size: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🧭 方向ナビゲーション</h1>

  <button onclick="startNavigation()">
    ナビを開始
  </button>

  <div class="value">
    現在の向き：<span id="heading">---</span>°
  </div>

  <div class="value">
    目的地方向：<span id="bearing">---</span>°
  </div>

  <div id="direction">
    ---
  </div>

  <div id="message">
    「ナビを開始」を押してください
  </div>

</div>

<script>

  // =========================
  // 目的地
  // =========================

  // 函館駅
  const destinationLat = 41.7737;
  const destinationLon = 140.7266;


  // =========================
  // 現在地
  // =========================

  let currentLat = null;
  let currentLon = null;


  // =========================
  // 正面判定の状態
  // =========================

  // 前回「正面だったか」
  let wasForward = false;


  // =========================
  // ナビ開始
  // =========================

  function startNavigation() {

    // GPS取得
    navigator.geolocation.watchPosition(
      position => {

        currentLat = position.coords.latitude;
        currentLon = position.coords.longitude;

        updateNavigation();

      },

      error => {

        document.getElementById("message").textContent =
          "GPSを取得できませんでした";

        console.log(error);

      },

      {
        enableHighAccuracy: true
      }
    );


    // コンパス取得
    if (typeof DeviceOrientationEvent !== "undefined") {

      window.addEventListener(
        "deviceorientationabsolute",
        handleOrientation,
        true
      );

    } else {

      document.getElementById("message").textContent =
        "この端末では方位センサーを利用できません";

    }
  }


  // =========================
  // コンパス
  // =========================

  function handleOrientation(event) {

    let heading = event.alpha;

    if (heading == null) {
      return;
    }

    heading = 360 - heading;

    if (heading >= 360) {
      heading -= 360;
    }

    document.getElementById("heading").textContent =
      Math.round(heading);

    updateDirection(heading);
  }


  // =========================
  // ナビゲーション更新
  // =========================

  function updateNavigation() {

    if (currentLat === null || currentLon === null) {
      return;
    }

    const bearing = calculateBearing(
      currentLat,
      currentLon,
      destinationLat,
      destinationLon
    );

    document.getElementById("bearing").textContent =
      Math.round(bearing);
  }


  // =========================
  // 目的地方向の計算
  // =========================

  function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;

    const Δλ =
      (lon2 - lon1) * Math.PI / 180;

    const y =
      Math.sin(Δλ) * Math.cos(φ2);

    const x =
      Math.cos(φ1) * Math.sin(φ2)
      -
      Math.sin(φ1) *
      Math.cos(φ2) *
      Math.cos(Δλ);

    let θ =
      Math.atan2(y, x) *
      180 / Math.PI;

    θ = (θ + 360) % 360;

    return θ;
  }


  // =========================
  // 左・右・正面の判定
  // =========================

  function updateDirection(heading) {

    if (currentLat === null ||
        currentLon === null) {
      return;
    }

    const bearing = calculateBearing(
      currentLat,
      currentLon,
      destinationLat,
      destinationLon
    );

    // 角度の差
    let difference =
      bearing - heading;

    // -180°～180°に変換
    difference =
      ((difference + 540) % 360) - 180;


    const directionElement =
      document.getElementById("direction");

    const messageElement =
      document.getElementById("message");


    // =========================
    // 正面かどうか
    // =========================

    const isForward =
      Math.abs(difference) <= 20;


    // =========================
    // 正面
    // =========================

    if (isForward) {

      directionElement.textContent =
        "↑ 正面";

      messageElement.textContent =
        "目的地の方向を向いています！";


      // 前回は正面ではなく、
      // 今回初めて正面になったときだけ振動
      if (!wasForward) {

        if (navigator.vibrate) {

          navigator.vibrate(300);

        }

      }

    }


    // =========================
    // 右
    // =========================

    else if (difference > 0) {

      directionElement.textContent =
        "→ 右";

      messageElement.textContent =
        "目的地は右側です";

    }


    // =========================
    // 左
    // =========================

    else {

      directionElement.textContent =
        "← 左";

      messageElement.textContent =
        "目的地は左側です";

    }


    // 今回の状態を保存
    wasForward = isForward;

  }

</script>

</body>
</html>
