<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Bluetooth振動テスト</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 26px;
    }

    button {
      display: block;
      width: 90%;
      margin: 20px auto;
      padding: 18px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
    }

    #status {
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📳 振動デバイステスト</h1>

  <button onclick="connectBluetooth()">
    Bluetooth接続
  </button>

  <button onclick="sendVibrate()">
    振動テスト
  </button>

  <div id="status">
    まず「Bluetooth接続」を押してください
  </div>

</div>


<script>

  // ========================================
  // AtomS3-LiteのBluetooth設定
  // ========================================

  const SERVICE_UUID =
    "6E400001-B5A3-F393-E0A9-E50E24DCCA9E";

  const CHARACTERISTIC_UUID =
    "6E400002-B5A3-F393-E0A9-E50E24DCCA9E";


  // Bluetoothデバイス
  let bluetoothDevice = null;

  // データを書き込むCharacteristic
  let rxCharacteristic = null;


  // ========================================
  // Bluetooth接続
  // ========================================

  async function connectBluetooth() {

    const status =
      document.getElementById("status");

    try {

      status.textContent =
        "Bluetoothデバイスを探しています…";


      // Bluetoothデバイスを探す
      bluetoothDevice =
        await navigator.bluetooth.requestDevice({

          filters: [
            {
              services: [SERVICE_UUID]
            }
          ]

        });


      status.textContent =
        "AtomS3-Liteに接続しています…";


      // GATTサーバーに接続
      const server =
        await bluetoothDevice.gatt.connect();


      // サービスを取得
      const service =
        await server.getPrimaryService(
          SERVICE_UUID
        );


      // Characteristicを取得
      rxCharacteristic =
        await service.getCharacteristic(
          CHARACTERISTIC_UUID
        );


      status.textContent =
        "✅ Bluetooth接続成功！";


    } catch (error) {

      console.log(error);

      status.textContent =
        "Bluetooth接続に失敗しました。\n" +
        error.message;

    }

  }


  // ========================================
  // 振動命令を送る
  // ========================================

  async function sendVibrate() {

    const status =
      document.getElementById("status");


    // 接続されているか確認
    if (!rxCharacteristic) {

      status.textContent =
        "先に「Bluetooth接続」を押してください";

      return;

    }


    try {

      // Atomに送る命令
      const command =
        new TextEncoder().encode("VIBRATE");


      // Bluetoothで送信
      await rxCharacteristic.writeValue(
        command
      );


      status.textContent =
        "📳 振動命令を送信しました！";


    } catch (error) {

      console.log(error);

      status.textContent =
        "振動命令の送信に失敗しました。\n" +
        error.message;

    }

  }

</script>

</body>
</html>
